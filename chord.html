<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コード譜ノート</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#222}
:root{--acc:#5349B7;--acc2:#3C3489;--bg:#fff;--bg2:#f5f5f5;--border:#e0e0e0;--text:#222;--text2:#666}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#111;--border:#333;--text:#eee;--text2:#999}}
#app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.topbar h1{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.sync-badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
.sync-badge.ok{color:#0F6E56;border-color:#5DCAA5}
.sync-badge.err{color:#993C1D;border-color:#F0997B}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
.folder-list{flex:1;overflow-y:auto;padding:8px}
.folder-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.folder-item:hover{background:var(--bg2);border-color:var(--border)}
.folder-icon{font-size:22px;flex-shrink:0}
.folder-info{flex:1;min-width:0}
.folder-name{font-size:14px;font-weight:600;color:var(--text)}
.folder-count{font-size:12px;color:var(--text2);margin-top:2px}
.folder-actions{display:flex;gap:4px}
.search-bar{padding:10px 14px;border-bottom:1px solid var(--border)}
.search-bar input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg2);color:var(--text)}
.song-list{flex:1;overflow-y:auto;padding:8px}
.song-item{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.song-item:hover{background:var(--bg2);border-color:var(--border)}
.song-info{flex:1;min-width:0}
.song-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:var(--text2);margin-top:2px}
.song-key{font-size:12px;color:var(--text2);background:var(--bg2);padding:2px 8px;border-radius:20px;border:1px solid var(--border);flex-shrink:0}
.list-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:none;color:var(--text);font-family:inherit}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-size:14px;padding:10px}
.btn.primary:hover{background:var(--acc2)}
.btn.danger{color:#993C1D}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.full{width:100%}
.edit-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.edit-header input{flex:1;min-width:90px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit}
.key-in{flex:0 0 80px!important}
.edit-help{padding:8px 14px;font-size:12px;color:var(--text2);background:var(--bg2);border-bottom:1px solid var(--border)}
.edit-area{flex:1;display:flex;flex-direction:column}
.edit-area textarea{flex:1;width:100%;padding:14px;font-family:'Courier New',monospace;font-size:14px;line-height:1.9;border:none;outline:none;resize:none;background:var(--bg);color:var(--text);min-height:300px}
.folder-assign{padding:10px 14px;border-top:1px solid var(--border);background:var(--bg2)}
.folder-assign-title{font-size:12px;color:var(--text2);margin-bottom:8px}
.folder-chips{display:flex;flex-wrap:wrap;gap:6px}
.folder-chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--bg);color:var(--text)}
.folder-chip.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.edit-foot{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.play-header{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:52px;z-index:9}
.play-title{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.play-artist{font-size:12px;color:var(--text2)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.ctrl-label{font-size:12px;color:var(--text2);white-space:nowrap}
.ctrl-row{display:flex;align-items:center;gap:5px}
input[type=range]{width:80px;accent-color:var(--acc)}
.ctrl-val{font-size:12px;font-weight:600;min-width:28px;color:var(--text)}
#play-content{flex:1;padding:16px 18px;cursor:pointer}
.lyric-line{line-height:1.85;color:var(--text)}
.section-label{font-size:11px;font-weight:700;color:var(--acc);margin-top:1.2em;margin-bottom:0.3em;letter-spacing:.07em;text-transform:uppercase}
.chord-lyric-line{display:flex;flex-wrap:wrap;align-items:flex-end;line-height:1;margin-bottom:0.6em}
.cl-chunk{display:inline-flex;flex-direction:column;align-items:flex-start}
.cl-chord{font-family:'Courier New',monospace;font-size:0.75em;font-weight:700;color:var(--acc);line-height:1;padding-bottom:2px;white-space:nowrap}
.cl-lyric{color:var(--text);line-height:1.4;white-space:pre}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text2);text-align:center}
.empty-icon{font-size:40px;opacity:.3}
.breadcrumb{padding:8px 14px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.breadcrumb .bc-link{cursor:pointer;color:var(--acc)}
.breadcrumb .bc-link:hover{text-decoration:underline}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg);border-radius:14px;padding:22px 20px;max-width:320px;width:90%;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:15px;color:var(--text)}
.modal input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg2);color:var(--text);font-family:inherit}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.drag-handle{cursor:grab;color:var(--text2);font-size:16px;padding:0 4px;user-select:none;touch-action:none}
.drag-handle:active{cursor:grabbing}
.song-item.dragging{opacity:0.4;border:1px dashed var(--acc)}
.song-item.drag-over{border-top:2px solid var(--acc)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>🎸 コード譜ノート</h1>
    <span class="sync-badge" id="sync-badge">同期中...</span>
    <button class="btn sm" onclick="loadAll()" title="再読み込み">↻</button>
  </div>

  <!-- フォルダ一覧 -->
  <div class="view on" id="folder-view">
    <div class="folder-list" id="folder-list"></div>
    <div class="list-footer">
      <button class="btn primary full" onclick="showNewFolderModal()">＋ セットリストを作成</button>
    </div>
  </div>

  <!-- 曲一覧 -->
  <div class="view" id="list-view">
    <div class="breadcrumb">
      <span class="bc-link" onclick="showView('folder')">🏠 ホーム</span>
      <span>›</span>
      <span id="breadcrumb-folder"></span>
      <span style="flex:1"></span>
      <button class="sort-btn" id="sort-toggle-btn" onclick="toggleSortMode()">⇅ 並び替え</button>
    </div>
    <div class="search-bar" id="search-bar-wrap">
      <input type="text" id="search-input" placeholder="曲名・アーティストで検索..." oninput="renderSongList()">
    </div>
    <div class="song-list" id="song-list"></div>
    <div class="list-footer">
      <button class="btn primary full" onclick="newSong()">＋ 新しい曲を追加</button>
    </div>
  </div>

  <!-- 編集 -->
  <div class="view" id="edit-view">
    <div class="edit-header">
      <input type="text" id="edit-title" placeholder="曲名">
      <input type="text" id="edit-artist" placeholder="アーティスト">
      <input type="text" id="edit-key" class="key-in" placeholder="Capo (3)">
      <button class="btn primary" onclick="saveSong()" style="width:auto;padding:8px 14px">💾 保存</button>
      <button class="btn" onclick="cancelEdit()">戻る</button>
      <button class="btn danger sm" id="del-btn" onclick="deleteSong()" style="display:none">🗑</button>
    </div>
    <div class="edit-help">コードは [Am] のように [ ] で囲む。セクションは「Aメロ:」のように末尾に : をつける。</div>
    <div class="edit-area">
      <textarea id="edit-body" placeholder="例：&#10;Aメロ:&#10;[G]春の [Em]光が [Am]降り注ぐ&#10;[C]君の [G]笑顔 [D]が眩しい"></textarea>
    </div>
    <div class="folder-assign">
      <div class="folder-assign-title">📂 セットリストに追加（複数選択可）</div>
      <div class="folder-chips" id="folder-chips"></div>
    </div>
    <div class="edit-foot">
      <button class="btn" onclick="previewSong()">▶ 演奏画面でプレビュー</button>
    </div>
  </div>

  <!-- 演奏 -->
  <div class="view" id="play-view">
    <div class="play-header">
      <div style="flex:1">
        <div class="play-title" id="play-title"></div>
        <div class="play-artist" id="play-artist"></div>
      </div>
      <span class="song-key" id="play-key"></span>
      <button class="btn sm" onclick="editCurrent()">✏️</button>
      <button class="btn sm" onclick="showView('list');renderSongList()">☰</button>
    </div>
    <div class="controls">
      <div class="ctrl-row">
        <span class="ctrl-label">文字</span>
        <input type="range" id="font-slider" min="12" max="30" value="17" step="1" oninput="updateFont(this.value)">
        <span class="ctrl-val" id="font-val">17px</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">速度</span>
        <input type="range" id="speed-slider" min="1" max="10" value="3" step="1" oninput="updateSpeed(this.value)">
        <span class="ctrl-val" id="speed-val">3</span>
      </div>
      <button class="btn" id="scroll-btn" onclick="toggleScroll()">▶ スクロール</button>
    </div>
    <div id="play-content" onclick="toggleScroll()">
      <div id="play-body"></div>
    </div>
  </div>
</div>

<!-- フォルダ名入力モーダル -->
<div class="modal-overlay" id="folder-modal" style="display:none" onclick="if(event.target===this)closeFolderModal()">
  <div class="modal">
    <h2 id="folder-modal-title">セットリストを作成</h2>
    <input type="text" id="folder-modal-input" placeholder="セットリスト名" />
    <div class="modal-btns">
      <button class="btn" onclick="closeFolderModal()">キャンセル</button>
      <button class="btn primary" style="width:auto;padding:8px 16px" onclick="saveFolderModal()">保存</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyReu53s4SY19VE4SjyUANV6YIGw6iVkp32Wd4BvLzr8glJNG5WsMZD9ezTr5WmVwkgGA/exec';
let songs = [], folders = [], folderSongs = [];
let currentFolderId = null;
let editingId = null, editingFolderIds = new Set();
let currentPlayId = null;
let scrollTimer = null, scrolling = false;
let fontSize = 17, scrollSpeed = 3;
let folderModalMode = 'new', folderModalTargetId = null;
let sortMode = false;
let dragSrcId = null;

async function gasGet(params) {
  try {
    const q = new URLSearchParams(params).toString();
    const res = await fetch(GAS_URL + '?' + q, { method: 'GET', redirect: 'follow', mode: 'cors' });
    return JSON.parse(await res.text());
  } catch(e) { return { error: e.message }; }
}

async function loadAll() {
  setBadge('同期中...', '');
  const data = await gasGet({ action: 'getAll' });
  if (data && data.songs) {
    songs = data.songs.sort((a,b) => (a.order||0) - (b.order||0));
    folders = data.folders || [];
    folderSongs = (data.folderSongs || []).sort((a,b) => (a.order||0) - (b.order||0));
    setBadge('同期済み ✓', 'ok');
  } else {
    setBadge('接続エラー', 'err');
  }
  renderFolderList();
}

function setBadge(text, cls) {
  const b = document.getElementById('sync-badge');
  b.textContent = text;
  b.className = 'sync-badge' + (cls ? ' ' + cls : '');
}

function showView(v) {
  stopScroll();
  document.querySelectorAll('.view').forEach(el => el.classList.remove('on'));
  document.getElementById(v + '-view').classList.add('on');
  window.scrollTo(0, 0);
}

function renderFolderList() {
  let html = `
    <div class="folder-item" onclick="openFolder(null)">
      <div class="folder-icon">🎵</div>
      <div class="folder-info">
        <div class="folder-name">全曲</div>
        <div class="folder-count">${songs.length}曲</div>
      </div>
    </div>`;
  folders.forEach(f => {
    const count = folderSongs.filter(fs => fs.folder_id === f.id).length;
    html += `
      <div class="folder-item" onclick="openFolder('${esc(f.id)}')">
        <div class="folder-icon">📂</div>
        <div class="folder-info">
          <div class="folder-name">${esc(f.name)}</div>
          <div class="folder-count">${count}曲</div>
        </div>
        <div class="folder-actions" onclick="event.stopPropagation()">
          <button class="btn sm" onclick="showRenameFolderModal('${esc(f.id)}','${esc(f.name)}')">✏️</button>
          <button class="btn sm danger" onclick="confirmDeleteFolder('${esc(f.id)}','${esc(f.name)}')">🗑</button>
        </div>
      </div>`;
  });
  document.getElementById('folder-list').innerHTML = html;
}

function openFolder(folderId) {
  currentFolderId = folderId;
  sortMode = false;
  const btn = document.getElementById('sort-toggle-btn');
  if (btn) { btn.textContent = '⇅ 並び替え'; btn.className = 'sort-btn'; }
  const sbw = document.getElementById('search-bar-wrap');
  if (sbw) sbw.style.display = '';
  const name = folderId ? (folders.find(f => f.id === folderId)?.name || '') : '全曲';
  document.getElementById('breadcrumb-folder').textContent = name;
  document.getElementById('search-input').value = '';
  showView('list');
  renderSongList();
}

function getSongsInCurrentFolder() {
  if (currentFolderId === null) return songs;
  const fsList = folderSongs
    .filter(fs => fs.folder_id === currentFolderId)
    .sort((a, b) => (a.order || 0) - (b.order || 0));
  return fsList.map(fs => songs.find(s => s.id === fs.song_id)).filter(Boolean);
}

function toggleSortMode() {
  sortMode = !sortMode;
  const btn = document.getElementById('sort-toggle-btn');
  btn.textContent = sortMode ? '✓ 完了' : '⇅ 並び替え';
  btn.className = 'sort-btn' + (sortMode ? ' active' : '');
  document.getElementById('search-bar-wrap').style.display = sortMode ? 'none' : '';
  renderSongList();
}

function renderSongList() {
  const q = sortMode ? '' : (document.getElementById('search-input').value || '').toLowerCase();
  const filtered = getSongsInCurrentFolder().filter(s =>
    !q || (s.title || '').toLowerCase().includes(q) || (s.artist || '').toLowerCase().includes(q)
  );
  const el = document.getElementById('song-list');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">♪</div><div>曲がありません</div></div>';
    return;
  }
  el.innerHTML = filtered.map(s => `
    <div class="song-item" id="si-${esc(s.id)}" draggable="${sortMode}" 
      onclick="${sortMode ? '' : `playSong('${esc(s.id)}')`}"
      ondragstart="onDragStart(event,'${esc(s.id)}')"
      ondragover="onDragOver(event)"
      ondragleave="onDragLeave(event)"
      ondrop="onDrop(event,'${esc(s.id)}')"
      ondragend="onDragEnd(event)">
      ${sortMode ? `<span class="drag-handle">☰</span>` : '<div style="font-size:22px">🎵</div>'}
      <div class="song-info">
        <div class="song-title">${esc(s.title)}</div>
        ${s.artist ? `<div class="song-artist">${esc(s.artist)}</div>` : ''}
      </div>
      ${s.key ? `<span class="song-key">Capo: ${esc(s.key)}</span>` : ''}
      ${sortMode ? '' : `<button class="btn sm" onclick="event.stopPropagation();editSong('${esc(s.id)}')">✏️</button>`}
    </div>
  `).join('');

  // タッチ対応ドラッグ
  if (sortMode) setupTouchDrag();
}

function onDragStart(e, id) {
  dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => document.getElementById('si-' + id)?.classList.add('dragging'), 0);
}
function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDragEnd(e) {
  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('dragging','drag-over'));
}
function onDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrcId || dragSrcId === targetId) return;
  reorderSongs(dragSrcId, targetId);
}

function reorderSongs(srcId, targetId) {
  const list = getSongsInCurrentFolder();
  const srcIdx = list.findIndex(s => s.id === srcId);
  const tgtIdx = list.findIndex(s => s.id === targetId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  const [moved] = list.splice(srcIdx, 1);
  list.splice(tgtIdx, 0, moved);

  if (currentFolderId === null) {
    // 全曲の並び替え → songsのorderを更新
    list.forEach((s, i) => { const song = songs.find(x => x.id === s.id); if (song) song.order = i; });
    saveOrder('updateSongOrder', list.map((s,i) => ({ id: s.id, order: i })));
  } else {
    // フォルダ内の並び替え → folderSongsのorderを更新
    list.forEach((s, i) => {
      const fs = folderSongs.find(x => x.folder_id === currentFolderId && x.song_id === s.id);
      if (fs) fs.order = i;
    });
    saveOrder('updateFolderSongOrder', list.map((s,i) => ({ folder_id: currentFolderId, song_id: s.id, order: i })));
  }
  renderSongList();
}

async function saveOrder(action, items) {
  setBadge('保存中...', '');
  const res = await gasGet({ action, items: JSON.stringify(items) });
  setBadge(res && res.success ? '保存しました ✓' : '保存エラー', res && res.success ? 'ok' : 'err');
}

function setupTouchDrag() {
  let touchSrcId = null, clone = null;
  document.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('touchstart', e => {
      const item = handle.closest('.song-item');
      touchSrcId = item.id.replace('si-', '');
      clone = item.cloneNode(true);
      clone.style.cssText = `position:fixed;opacity:0.7;pointer-events:none;width:${item.offsetWidth}px;z-index:999;background:var(--bg);border-radius:8px;border:1px solid var(--acc)`;
      document.body.appendChild(clone);
    }, { passive: true });
    handle.addEventListener('touchmove', e => {
      if (!clone) return;
      const t = e.touches[0];
      clone.style.left = t.clientX - clone.offsetWidth/2 + 'px';
      clone.style.top  = t.clientY - 30 + 'px';
      const el = document.elementFromPoint(t.clientX, t.clientY)?.closest('.song-item');
      document.querySelectorAll('.song-item').forEach(i => i.classList.remove('drag-over'));
      if (el) el.classList.add('drag-over');
    }, { passive: true });
    handle.addEventListener('touchend', e => {
      if (clone) { clone.remove(); clone = null; }
      document.querySelectorAll('.song-item').forEach(i => i.classList.remove('drag-over'));
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY)?.closest('.song-item');
      if (el && touchSrcId) {
        const targetId = el.id.replace('si-', '');
        if (targetId !== touchSrcId) reorderSongs(touchSrcId, targetId);
      }
      touchSrcId = null;
    });
  });
}

function renderFolderChips(songId) {
  const el = document.getElementById('folder-chips');
  if (!folders.length) { el.innerHTML = '<span style="font-size:12px;color:var(--text2)">セットリストがまだありません</span>'; return; }
  const active = folderSongs.filter(fs => fs.song_id === songId).map(fs => fs.folder_id);
  editingFolderIds = new Set(active);
  el.innerHTML = folders.map(f =>
    `<span class="folder-chip ${editingFolderIds.has(f.id) ? 'active' : ''}" onclick="toggleFolderChip('${esc(f.id)}')">${esc(f.name)}</span>`
  ).join('');
}

function toggleFolderChip(folderId) {
  editingFolderIds.has(folderId) ? editingFolderIds.delete(folderId) : editingFolderIds.add(folderId);
  document.querySelectorAll('.folder-chip').forEach((chip, i) => {
    chip.className = 'folder-chip' + (folders[i] && editingFolderIds.has(folders[i].id) ? ' active' : '');
  });
}

function newSong() {
  editingId = null;
  editingFolderIds = new Set(currentFolderId ? [currentFolderId] : []);
  ['edit-title','edit-artist','edit-key','edit-body'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('del-btn').style.display = 'none';
  renderFolderChips(null);
  if (currentFolderId) {
    setTimeout(() => document.querySelectorAll('.folder-chip').forEach((chip, i) => {
      if (folders[i] && editingFolderIds.has(folders[i].id)) chip.classList.add('active');
    }), 0);
  }
  showView('edit');
}

function editSong(id) {
  const s = songs.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  document.getElementById('edit-title').value = s.title || '';
  document.getElementById('edit-artist').value = s.artist || '';
  document.getElementById('edit-key').value = s.key || '';
  document.getElementById('edit-body').value = s.body || '';
  document.getElementById('del-btn').style.display = '';
  renderFolderChips(id);
  showView('edit');
}

function cancelEdit() { showView('list'); renderSongList(); }

async function saveSong() {
  const song = {
    id:     editingId || String(Date.now()),
    title:  document.getElementById('edit-title').value.trim() || '無題',
    artist: document.getElementById('edit-artist').value.trim(),
    key:    document.getElementById('edit-key').value.trim(),
    body:   document.getElementById('edit-body').value
  };
  setBadge('保存中...', '');
  const res = await gasGet({ action: 'saveSong', ...song });
  if (res && res.success) {
    if (res.id) song.id = res.id;
    const idx = songs.findIndex(x => x.id === song.id);
    if (idx >= 0) songs[idx] = song; else songs.push(song);
    const prev = folderSongs.filter(fs => fs.song_id === song.id).map(fs => fs.folder_id);
    const toAdd    = [...editingFolderIds].filter(id => !prev.includes(id));
    const toRemove = prev.filter(id => !editingFolderIds.has(id));
    for (const fid of toAdd)    await gasGet({ action: 'addSongToFolder',      folder_id: fid, song_id: song.id });
    for (const fid of toRemove) await gasGet({ action: 'removeSongFromFolder', folder_id: fid, song_id: song.id });
    folderSongs = folderSongs.filter(fs => !(fs.song_id === song.id && toRemove.includes(fs.folder_id)));
    for (const fid of toAdd) folderSongs.push({ folder_id: fid, song_id: song.id });
    setBadge('保存しました ✓', 'ok');
    showView('list'); renderSongList(); renderFolderList();
  } else {
    setBadge('保存エラー', 'err');
    alert('保存に失敗しました。');
  }
}

async function deleteSong() {
  if (!editingId || !confirm('この曲を削除しますか？')) return;
  setBadge('削除中...', '');
  const res = await gasGet({ action: 'deleteSong', id: editingId });
  if (res && res.success) {
    songs = songs.filter(x => x.id !== editingId);
    folderSongs = folderSongs.filter(fs => fs.song_id !== editingId);
    editingId = null;
    setBadge('削除しました', 'ok');
    showView('list'); renderSongList(); renderFolderList();
  } else { setBadge('削除エラー', 'err'); }
}

function showNewFolderModal() {
  folderModalMode = 'new'; folderModalTargetId = null;
  document.getElementById('folder-modal-title').textContent = 'セットリストを作成';
  document.getElementById('folder-modal-input').value = '';
  document.getElementById('folder-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('folder-modal-input').focus(), 50);
}

function showRenameFolderModal(id, name) {
  folderModalMode = 'rename'; folderModalTargetId = id;
  document.getElementById('folder-modal-title').textContent = 'セットリスト名を変更';
  document.getElementById('folder-modal-input').value = name;
  document.getElementById('folder-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('folder-modal-input').focus(), 50);
}

function closeFolderModal() { document.getElementById('folder-modal').style.display = 'none'; }

async function saveFolderModal() {
  const name = document.getElementById('folder-modal-input').value.trim();
  if (!name) return;
  closeFolderModal();
  setBadge('保存中...', '');
  const params = { action: 'saveFolder', name };
  if (folderModalMode === 'rename') params.id = folderModalTargetId;
  const res = await gasGet(params);
  if (res && res.success) {
    if (folderModalMode === 'new') folders.push({ id: res.id, name });
    else { const f = folders.find(x => x.id === folderModalTargetId); if (f) f.name = name; }
    setBadge('保存しました ✓', 'ok'); renderFolderList();
  } else { setBadge('保存エラー', 'err'); }
}

async function confirmDeleteFolder(id, name) {
  if (!confirm(`「${name}」を削除しますか？\n（曲自体は削除されません）`)) return;
  setBadge('削除中...', '');
  const res = await gasGet({ action: 'deleteFolder', id });
  if (res && res.success) {
    folders = folders.filter(f => f.id !== id);
    folderSongs = folderSongs.filter(fs => fs.folder_id !== id);
    setBadge('削除しました', 'ok'); renderFolderList();
  } else { setBadge('削除エラー', 'err'); }
}

function previewSong() {
  renderPlay({ id: editingId, title: document.getElementById('edit-title').value || '無題',
    artist: document.getElementById('edit-artist').value, key: document.getElementById('edit-key').value,
    body: document.getElementById('edit-body').value });
}

function playSong(id) { const s = songs.find(x => x.id === id); if (s) { currentPlayId = id; renderPlay(s); } }
function editCurrent() { if (currentPlayId) editSong(currentPlayId); }

function renderPlay(s) {
  document.getElementById('play-title').textContent = s.title || '';
  document.getElementById('play-artist').textContent = s.artist || '';
  const keyEl = document.getElementById('play-key');
  keyEl.textContent = s.key ? 'Capo: ' + s.key : ''; keyEl.style.display = s.key ? '' : 'none';
  document.getElementById('play-body').innerHTML = parseChords(s.body || '');
  document.getElementById('play-body').style.fontSize = fontSize + 'px';
  document.getElementById('play-content').scrollTop = 0;
  window.scrollTo(0, 0); stopScroll(); showView('play');
}

function parseChords(text) {
  let html = '';
  for (const line of text.split('\n')) {
    if (!line.trim()) { html += '<div style="height:0.6em"></div>'; continue; }
    if (/^[^\[]+:$/.test(line.trim())) { html += `<div class="section-label">${esc(line.trim().slice(0,-1))}</div>`; continue; }
    if (line.includes('[')) {
      const segs = line.split(/(\[[^\]]+\])/g).map(p =>
        p.startsWith('[') && p.endsWith(']') ? { type:'chord', val: p.slice(1,-1) } : { type:'lyric', val: p }
      );
      let lineHtml = '<div class="chord-lyric-line">';
      for (let i = 0; i < segs.length; i++) {
        const seg = segs[i];
        if (seg.type === 'chord') {
          const nextSeg = segs[i+1]; const lyric = (nextSeg && nextSeg.type === 'lyric') ? nextSeg.val : '';
          const dl = lyric ? esc(lyric) : `<span style="display:inline-block;min-width:${seg.val.length+2}ch"> </span>`;
          lineHtml += `<span class="cl-chunk"><span class="cl-chord">${esc(seg.val)}</span><span class="cl-lyric">${dl}</span></span>`;
          if (lyric) i++;
        } else { if (seg.val) lineHtml += `<span class="cl-chunk"><span class="cl-chord"> </span><span class="cl-lyric">${esc(seg.val)}</span></span>`; }
      }
      html += lineHtml + '</div>';
    } else { html += `<div class="lyric-line">${esc(line)}</div>`; }
  }
  return html;
}

function updateFont(v) { fontSize = parseInt(v); document.getElementById('font-val').textContent = fontSize+'px'; const pb = document.getElementById('play-body'); if(pb) pb.style.fontSize = fontSize+'px'; }
function updateSpeed(v) { scrollSpeed = parseInt(v); document.getElementById('speed-val').textContent = scrollSpeed; if(scrolling){stopScroll();startScroll();} }
function toggleScroll() { scrolling ? stopScroll() : startScroll(); }
function startScroll() {
  scrolling = true; document.getElementById('scroll-btn').textContent = '⏸ 一時停止';
  const interval = Math.round(110 - scrollSpeed * 9);
  scrollTimer = setInterval(() => { window.scrollBy(0,1); if((window.innerHeight+window.scrollY)>=document.body.scrollHeight-2) stopScroll(); }, interval);
}
function stopScroll() {
  scrolling = false; clearInterval(scrollTimer); scrollTimer = null;
  const btn = document.getElementById('scroll-btn'); if(btn) btn.textContent = '▶ スクロール';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('folder-modal-input').addEventListener('keydown', e => { if(e.key==='Enter') saveFolderModal(); });

loadAll();
</script>
