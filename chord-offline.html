<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コード譜ノート［オフライン］</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#222}
:root{--acc:#5349B7;--acc2:#3C3489;--bg:#fff;--bg2:#f5f5f5;--border:#e0e0e0;--text:#222;--text2:#666}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#111;--border:#333;--text:#eee;--text2:#999}}
#app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.topbar h1{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
.badge.ok{color:#0F6E56;border-color:#5DCAA5}
.badge.err{color:#993C1D;border-color:#F0997B}
.badge.warn{color:#7A5C00;border-color:#E5C04B}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
.search-bar{padding:10px 14px;border-bottom:1px solid var(--border)}
.search-bar input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg2);color:var(--text)}
.song-list{flex:1;overflow-y:auto;padding:8px}
.song-item{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.song-item:hover{background:var(--bg2);border-color:var(--border)}
.song-info{flex:1;min-width:0}
.song-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:var(--text2);margin-top:2px}
.song-key{font-size:12px;color:var(--text2);background:var(--bg2);padding:2px 8px;border-radius:20px;border:1px solid var(--border);flex-shrink:0}
.list-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sync-info{font-size:11px;color:var(--text2);text-align:center}
.btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:none;color:var(--text);font-family:inherit}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;font-size:14px;padding:10px}
.btn.primary:hover{background:var(--acc2)}
.btn.sm{padding:5px 10px;font-size:12px}
.play-header{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:52px;z-index:9}
.play-title{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.play-artist{font-size:12px;color:var(--text2)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.ctrl-label{font-size:12px;color:var(--text2);white-space:nowrap}
.ctrl-row{display:flex;align-items:center;gap:5px}
input[type=range]{width:80px;accent-color:var(--acc)}
.ctrl-val{font-size:12px;font-weight:600;min-width:28px;color:var(--text)}
#play-content{flex:1;padding:16px 18px;cursor:pointer}
.lyric-line{line-height:1.85;color:var(--text)}
.section-label{font-size:11px;font-weight:700;color:var(--acc);margin-top:1.2em;margin-bottom:0.3em;letter-spacing:.07em;text-transform:uppercase}
.chord-lyric-line{display:flex;flex-wrap:wrap;align-items:flex-end;line-height:1;margin-bottom:0.6em}
.cl-chunk{display:inline-flex;flex-direction:column;align-items:flex-start}
.cl-chord{font-family:'Courier New',monospace;font-size:0.75em;font-weight:700;color:var(--acc);line-height:1;padding-bottom:2px;white-space:nowrap}
.cl-lyric{color:var(--text);line-height:1.4;white-space:pre}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text2);text-align:center}
.empty-icon{font-size:40px;opacity:.3}
.sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
.sync-card{background:var(--bg);border-radius:14px;padding:24px 28px;max-width:320px;width:90%;text-align:center;display:flex;flex-direction:column;gap:14px}
.sync-card h2{font-size:16px;color:var(--text)}
.sync-card p{font-size:13px;color:var(--text2);line-height:1.6}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>🎸 コード譜［オフライン］</h1>
    <span class="badge" id="status-badge">読込中...</span>
  </div>

  <!-- 曲一覧 -->
  <div class="view on" id="list-view">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="曲名・アーティストで検索..." oninput="renderList()">
    </div>
    <div class="song-list" id="song-list">
      <div class="empty"><div class="empty-icon">♪</div><div>読み込み中...</div></div>
    </div>
    <div class="list-footer">
      <button class="btn primary" onclick="startSync()">☁️ データを更新する</button>
      <div class="sync-info" id="sync-info">最終更新：未取得</div>
    </div>
  </div>

  <!-- 演奏 -->
  <div class="view" id="play-view">
    <div class="play-header">
      <div style="flex:1">
        <div class="play-title" id="play-title"></div>
        <div class="play-artist" id="play-artist"></div>
      </div>
      <span class="song-key" id="play-key"></span>
      <button class="btn sm" onclick="showView('list')">☰</button>
    </div>
    <div class="controls">
      <div class="ctrl-row">
        <span class="ctrl-label">文字</span>
        <input type="range" id="font-slider" min="12" max="30" value="17" step="1" oninput="updateFont(this.value)">
        <span class="ctrl-val" id="font-val">17px</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">速度</span>
        <input type="range" id="speed-slider" min="1" max="10" value="3" step="1" oninput="updateSpeed(this.value)">
        <span class="ctrl-val" id="speed-val">3</span>
      </div>
      <button class="btn" id="scroll-btn" onclick="toggleScroll()">▶ スクロール</button>
    </div>
    <div id="play-content" onclick="toggleScroll()">
      <div id="play-body"></div>
    </div>
  </div>
</div>

<!-- 同期中オーバーレイ -->
<div class="sync-overlay" id="sync-overlay" style="display:none">
  <div class="sync-card" id="sync-card">
    <div class="spinner"></div>
    <h2>データを取得中...</h2>
    <p>スプレッドシートから曲データを読み込んでいます</p>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyReu53s4SY19VE4SjyUANV6YIGw6iVkp32Wd4BvLzr8glJNG5WsMZD9ezTr5WmVwkgGA/exec';
const STORAGE_KEY = 'chord_offline_songs';
const STORAGE_DATE_KEY = 'chord_offline_date';

let songs = [];
let currentPlayId = null;
let scrollTimer = null;
let scrolling = false;
let fontSize = 17;
let scrollSpeed = 3;

// 起動時：ローカルデータを読み込む
function init() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      songs = JSON.parse(raw);
      const date = localStorage.getItem(STORAGE_DATE_KEY);
      setBadge('オフライン', '');
      document.getElementById('sync-info').textContent = '最終更新：' + (date || '不明');
    } catch(e) {
      songs = [];
    }
  } else {
    setBadge('データなし', 'warn');
    document.getElementById('sync-info').textContent = '「データを更新する」で取得してください';
  }
  renderList();
}

// オンラインで最新データを取得してローカルに保存
async function startSync() {
  showOverlay(true, 'データを取得中...', 'スプレッドシートから曲データを読み込んでいます');
  try {
    const q = new URLSearchParams({ action: 'getAll' }).toString();
    const res = await fetch(GAS_URL + '?' + q, { method: 'GET', redirect: 'follow', mode: 'cors' });
    const data = await res.json();
    if (Array.isArray(data)) {
      songs = data;
      const now = new Date().toLocaleString('ja-JP');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
      localStorage.setItem(STORAGE_DATE_KEY, now);
      showOverlay(true, '更新完了！', `${songs.length}曲を保存しました\nこれでオフラインでも見られます`, true);
      setBadge('オフライン', '');
      document.getElementById('sync-info').textContent = '最終更新：' + now;
      renderList();
    } else {
      showOverlay(true, '接続エラー', 'スプレッドシートに接続できませんでした\nWi-Fiを確認してください', true, true);
    }
  } catch(e) {
    showOverlay(true, '接続エラー', 'ネットワークに接続できませんでした\nWi-Fiを確認してください', true, true);
  }
}

function showOverlay(show, title, msg, showClose, isErr) {
  const overlay = document.getElementById('sync-overlay');
  const card = document.getElementById('sync-card');
  if (!show) { overlay.style.display = 'none'; return; }
  overlay.style.display = 'flex';
  card.innerHTML = showClose
    ? `<h2>${title}</h2><p style="white-space:pre-line">${msg}</p><button class="btn primary" onclick="document.getElementById('sync-overlay').style.display='none'">閉じる</button>`
    : `<div class="spinner"></div><h2>${title}</h2><p>${msg}</p>`;
}

function setBadge(text, cls) {
  const b = document.getElementById('status-badge');
  b.textContent = text;
  b.className = 'badge' + (cls ? ' ' + cls : '');
}

function showView(v) {
  stopScroll();
  document.querySelectorAll('.view').forEach(el => el.classList.remove('on'));
  document.getElementById(v + '-view').classList.add('on');
  window.scrollTo(0, 0);
}

function renderList() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  const filtered = songs.filter(s =>
    (s.title || '').toLowerCase().includes(q) ||
    (s.artist || '').toLowerCase().includes(q)
  );
  const el = document.getElementById('song-list');
  if (!filtered.length) {
    el.innerHTML = songs.length === 0
      ? '<div class="empty"><div class="empty-icon">♪</div><div>曲データがありません<br>下の「データを更新する」を押してください</div></div>'
      : '<div class="empty"><div class="empty-icon">🔍</div><div>該当する曲がありません</div></div>';
    return;
  }
  el.innerHTML = filtered.map(s => `
    <div class="song-item" onclick="playSong('${esc(s.id)}')">
      <div style="font-size:22px">🎵</div>
      <div class="song-info">
        <div class="song-title">${esc(s.title)}</div>
        ${s.artist ? `<div class="song-artist">${esc(s.artist)}</div>` : ''}
      </div>
      ${s.key ? `<span class="song-key">Key: ${esc(s.key)}</span>` : ''}
    </div>
  `).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function playSong(id) {
  const s = songs.find(x => x.id === id);
  if (s) { currentPlayId = id; renderPlay(s); }
}

function renderPlay(s) {
  document.getElementById('play-title').textContent = s.title || '';
  document.getElementById('play-artist').textContent = s.artist || '';
  const keyEl = document.getElementById('play-key');
  keyEl.textContent = s.key ? 'Key: ' + s.key : '';
  keyEl.style.display = s.key ? '' : 'none';
  document.getElementById('play-body').innerHTML = parseChords(s.body || '');
  document.getElementById('play-body').style.fontSize = fontSize + 'px';
  window.scrollTo(0, 0);
  stopScroll();
  showView('play');
}

function parseChords(text) {
  let html = '';
  for (const line of text.split('\n')) {
    if (!line.trim()) { html += '<div style="height:0.6em"></div>'; continue; }
    if (/^[^\[]+:$/.test(line.trim())) {
      html += `<div class="section-label">${esc(line.trim().slice(0,-1))}</div>`;
      continue;
    }
    if (line.includes('[')) {
      const segs = line.split(/(\[[^\]]+\])/g).map(p =>
        p.startsWith('[') && p.endsWith(']')
          ? { type:'chord', val: p.slice(1,-1) }
          : { type:'lyric', val: p }
      );
      let lineHtml = '<div class="chord-lyric-line">';
      for (let i = 0; i < segs.length; i++) {
        const seg = segs[i];
        if (seg.type === 'chord') {
          const nextSeg = segs[i+1];
          const lyric = (nextSeg && nextSeg.type === 'lyric') ? nextSeg.val : '';
          lineHtml += `<span class="cl-chunk"><span class="cl-chord">${esc(seg.val)}</span><span class="cl-lyric">${esc(lyric) || ' '}</span></span>`;
          if (lyric) i++;
        } else {
          if (seg.val) lineHtml += `<span class="cl-chunk"><span class="cl-chord"> </span><span class="cl-lyric">${esc(seg.val)}</span></span>`;
        }
      }
      lineHtml += '</div>';
      html += lineHtml;
    } else {
      html += `<div class="lyric-line">${esc(line)}</div>`;
    }
  }
  return html;
}

function updateFont(v) {
  fontSize = parseInt(v);
  document.getElementById('font-val').textContent = fontSize + 'px';
  const pb = document.getElementById('play-body');
  if (pb) pb.style.fontSize = fontSize + 'px';
}

function updateSpeed(v) {
  scrollSpeed = parseInt(v);
  document.getElementById('speed-val').textContent = scrollSpeed;
  if (scrolling) { stopScroll(); startScroll(); }
}

function toggleScroll() {
  scrolling ? stopScroll() : startScroll();
}

function startScroll() {
  scrolling = true;
  document.getElementById('scroll-btn').textContent = '⏸ 一時停止';
  const interval = Math.round(110 - scrollSpeed * 9);
  scrollTimer = setInterval(() => {
    window.scrollBy(0, 1);
    const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2;
    if (atBottom) stopScroll();
  }, interval);
}

function stopScroll() {
  scrolling = false;
  clearInterval(scrollTimer);
  scrollTimer = null;
  const btn = document.getElementById('scroll-btn');
  if (btn) btn.textContent = '▶ スクロール';
}

init();
</script>
</body>
</html>
